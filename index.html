<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FB Print Fotos Web</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><b>FB Print Fotos</b><span>Web v5.0</span></div><div class="actions"><label class="btn">+ Fotos<input id="files" type="file" accept="image/*" multiple hidden></label><button id="clear">Limpar</button><button id="savePdf" class="primary">Salvar PDF</button></div></header>
<main><aside>
<details open><summary>Fotos <span class="sumhint">adicionar e selecionar</span></summary><div class="panel"><div id="drop" role="button" tabindex="0"><strong>Adicionar fotos</strong><span>Clique para selecionar ou arraste os arquivos para esta área.</span></div><div id="thumbs"></div></div></details>
<details open><summary>Montagem <span class="sumhint">folha e distribuição</span></summary><div class="panel compact-grid">
<label>Orientação<select id="orientation"><option value="p">A4 vertical</option><option value="l">A4 horizontal</option></select></label>
<label>Tipo<select id="mode"><option value="size">Tamanho da foto</option><option value="grid">Grade</option><option value="polaroid">Polaroid</option></select></label>
<div id="polaroidOpts" class="span2 compact-grid"><label>Quantidade<select id="preset"><option value="8">8 por A4</option><option value="9" selected>9 por A4</option><option value="12">12 por A4</option><option value="custom">Tamanho personalizado</option></select></label><div id="polaroidCustom" class="span2 compact-grid"><label>Largura mm<input id="polaroidW" type="number" min="20" max="290" step="0.5" value="60"></label><label>Altura mm<input id="polaroidH" type="number" min="20" max="290" step="0.5" value="85"></label></div><label>Formato<select id="shape"><option value="classic">Retangular</option><option value="square">Mais quadrado</option></select></label><label>Moldura<select id="texture"><option value="plain">Lisa</option><option value="paper" selected>Texturizada</option></select></label><label>Cor<input id="frameColor" type="color" value="#ffffff"></label><label class="span2 range-label">Textura <span id="intensityVal">65%</span><input id="intensity" type="range" min="0" max="100" value="65"></label></div>
<div id="sizeOpts" class="span2 compact-grid"><label>Largura mm<input id="photoW" type="number" min="10" max="300" step="1" value="100"></label><label>Altura mm<input id="photoH" type="number" min="10" max="300" step="1" value="150"></label></div>
<div id="gridOpts" class="span2 compact-grid"><label>Colunas<input id="cols" type="number" min="1" max="20" value="2"></label><label>Linhas<input id="rows" type="number" min="1" max="20" value="2"></label></div>
<label class="check span2"><input id="respectMargin" type="checkbox" checked> Respeitar margem de segurança</label><label>Margem mm<input id="margin" type="number" min="0" max="50" step="0.5" value="5"></label><label>Espaço mm<input id="spacing" type="number" min="0" max="50" step="0.5" value="2"></label>
<div class="checks span2"><label class="check"><input id="repeat" type="checkbox" checked> Repetir foto única</label><label class="check"><input id="cropMarks" type="checkbox" checked> Marcas de corte</label></div><div id="info" class="span2"></div>
</div></details>
<details><summary>Ajustar foto <span class="sumhint">zoom, posição e giro</span></summary><div class="panel compact-grid"><label class="span2">Enquadramento<select id="fit"><option value="fill">Preencher — pode cortar</option><option value="fit">Ajustar — foto inteira</option><option value="stretch">Esticar</option></select></label><div class="hint span2">Arraste a foto para mover • roda do mouse = zoom • duplo clique = redefinir.</div><label class="span2 range-label">Zoom <span id="zoomVal">100%</span><input id="zoom" type="range" min="50" max="300" value="100"></label><label>X<input id="offsetX" type="range" min="-100" max="100" value="0"></label><label>Y<input id="offsetY" type="range" min="-100" max="100" value="0"></label><button id="rotate" class="span2">Girar foto 90°</button></div></details>
</aside>
<div class="workspace"><div class="pager"><button id="prev">◀</button><span id="pageLabel">Página 1/1</span><button id="next">▶</button></div><canvas id="canvas"></canvas></div></main><script src="app.js"></script></body></html>
